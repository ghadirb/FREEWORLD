name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

permissions:
  contents: write

jobs:
  tests:
    name: Unit and multiplayer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Unit tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/unit_tests.gd 2>&1 | tee unit.log
      - name: Multiplayer integration tests
        run: |
          set -o pipefail
          tests/integration.sh godot 2>&1 | tee integration.log
      - name: Offline mode tests (solo, restart, host + guest)
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/local_test.gd 2>&1 | tee local.log
          grep -q "RESULT: ALL PASSED" local.log
      - name: Publish failure details
        if: failure()
        run: |
          for f in unit.log integration.log local.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E "FAIL|Error|ERROR|Parse|INTEGRATION" "$f" | tail -n 30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  visual-smoke:
    name: Client render smoke test
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and a virtual display
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 >/dev/null
          godot --headless --path . --import || true
      - name: Server, village bot and screenshots
        run: |
          set -o pipefail
          mkdir -p shots data
          godot --headless --path . -- --server --port 17888 --seed 2026 --data-dir data > server.log 2>&1 &
          sleep 5
          godot --headless --path . --script res://tests/bot.gd -- --scenario village --name builder1 --port 17888 --token-file data/b.token | grep "^\[bot"
          for m in life world; do
            xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 -- --connect 127.0.0.1:17888 --name viewer1 --shot shots/$m.png --shot-delay 7 --shot-mode $m 2>&1 | tee -a render.log
          done
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 -- --connect 127.0.0.1:17888 --name viewer1 --shot shots/build.png --shot-delay 7 --shot-mode world --build shop 2>&1 | tee -a render.log
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 -- --shot shots/menu.png --shot-delay 2 2>&1 | tee -a render.log
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 -- --solo tester1 --build house --shot shots/solo_build.png --shot-delay 7 2>&1 | tee -a render.log
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 -- --solo tester2 --enter house --shot shots/solo_inside.png --shot-delay 9 2>&1 | tee -a render.log
          test "$(stat -c%s shots/solo_inside.png)" -gt 30000
          test "$(stat -c%s shots/solo_build.png)" -gt 30000
          test -s shots/life.png && test -s shots/world.png && test -s shots/build.png && test -s shots/menu.png
          # منوی خالی (تک‌رنگ) حجم بسیار کم دارد؛ این بررسی جلوی صفحهٔ سفید/خالی را می‌گیرد
          test "$(stat -c%s shots/menu.png)" -gt 20000
          ! grep -E "SCRIPT ERROR" render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      - name: Publish failure details
        if: failure()
        run: |
          msg=$(grep -E "SCRIPT ERROR|ERROR|FAIL" render.log server.log 2>/dev/null | tail -n 25 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=render smoke failed::$msg"

  export:
    name: Export ${{ matrix.preset }}
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            output: build/linux/freeworld.x86_64
            artifact: freeworld-linux
          - preset: Windows
            output: build/windows/freeworld.exe
            artifact: freeworld-windows
          - preset: Android
            output: build/android/freeworld-debug.apk
            artifact: freeworld-android-debug
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - uses: actions/setup-java@v4
        if: matrix.preset == 'Android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK and debug keystore
        if: matrix.preset == 'Android'
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" >/dev/null
          # کلید دیباگ ثابت (build_config/debug.keystore): هر بیلد با همان امضا ساخته می‌شود تا نصب روی نسخهٔ قبلی خطای ناهمخوانی امضا ندهد.
          cp build_config/debug.keystore "$HOME/debug.keystore"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Export
        run: |
          set -o pipefail
          mkdir -p "$(dirname '${{ matrix.output }}')"
          godot --headless --path . --export-debug "${{ matrix.preset }}" "${{ matrix.output }}" 2>&1 | tee export.log
          test -s "${{ matrix.output }}"
          ls -la "$(dirname '${{ matrix.output }}')"
      - name: Export signed release APK (only when the keystore secrets exist)
        if: matrix.preset == 'Android'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice title=release signing skipped::secret ANDROID_KEYSTORE_BASE64 is empty or missing"
            exit 0
          fi
          echo "secret lengths: keystore=${#KEYSTORE_B64} alias=${#GODOT_ANDROID_KEYSTORE_RELEASE_USER} password=${#GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD}"
          set -o pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          godot --headless --path . --export-release Android build/android/freeworld-release.apk 2>&1 | tee export-release.log
          test -s build/android/freeworld-release.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/34.0.0/apksigner" verify --print-certs build/android/freeworld-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Upload signed release APK
        if: matrix.preset == 'Android' && hashFiles('build/android/freeworld-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: freeworld-android-release-signed
          path: build/android/freeworld-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/
      - name: Publish failure details
        if: failure()
        run: |
          msg=$(tail -n 40 export.log 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=export ${{ matrix.preset }} failed::$msg"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.apk
            dist/**/*.exe
            dist/**/*.x86_64
